#!/usr/sbin/nft -f
# Sample ruleset for the edge firewall gateway (fw-gw-01), modeled on the
# Network Security Lab project: three segmented zones behind a single
# nftables-based gateway.

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        ct state established,related accept
        iif "lo" accept
        tcp dport 22 ip saddr 10.10.0.0/24 accept   # SSH from management zone only
        tcp dport 51820 accept                       # WireGuard VPN
        ct state invalid drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        iifname "vlan-mgmt" oifname "vlan-prod" tcp dport { 22, 443 } accept
        iifname "vlan-prod" oifname "vlan-mgmt" drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
