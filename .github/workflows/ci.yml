name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Audit the sample inventory
        # The sample inventory is deliberately misconfigured, so the audit must
        # find Critical/High issues and exit with code 1, and write a report.
        run: |
          code=0
          python audit.py || code=$?
          test "$code" -eq 1
          test -s report.md

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

      - name: Initialise without a backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate
        working-directory: terraform
        run: terraform validate
